[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vneurotk"
dynamic = ["version"]
description = "A python toolkit for visual neuroscience"
readme = "README.md"
authors = [
  {name = "Guohao Zhang", email = "guohao2045@gmail.com"}
]
maintainers = [
  {name = "Guohao Zhang", email = "guohao2045@gmail.com"}
]
classifiers = [
    "Typing :: Typed",
]
license = {text = "MIT"}

requires-python = ">= 3.11"
dependencies = [
  "h5py",
  "loguru",
  "numpy",
  "pandas",
  "pillow",
  "pooch",
  "rich",
  "scipy",
  "tqdm",
  "typing-extensions",
]

[project.optional-dependencies]
vision = ["torch", "transformers"]
viz = ["matplotlib"]
mne = ["mne", "mne-bids"]
notebook = ["ipykernel", "ipywidgets"]
timm = ["torch", "transformers", "timm"]
thingsvision = [
    "torch; python_version < '3.13'",
    "transformers; python_version < '3.13'",
    "numba>=0.59; python_version < '3.13'",
    "thingsvision>=1.4.4; python_version < '3.13'",
]
cebra = ["cebra>=0.6.0", "trialcebra>=0.0.5"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    { include-group = "docs" },
]

lint = [
    "ruff",
]
test = [
    "coverage",
    "pytest",
]
typecheck = [
    "ty",
]
docs = [
    "zensical",
    "mkdocstrings-python",
    "nbconvert",
    "nbformat",
    "bleach[css]",
]
packaging = [
    "check-wheel-contents",
    "PyYAML",
    "twine",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
artifacts = [
    "/src/vneurotk/py.typed",
]
include = [
    "/CITATION.cff",
    "/LICENSE",
    "/README.md",
    "/src/vneurotk/**/*.py",
]
exclude = [
    "/.github",
    "/build",
    "/dist",
    "/docs",
    "/notebooks",
    "/site",
    "/tests",
    "**/__pycache__",
    "**/*.db",
    "**/*.ipynb",
    "**/*.py[co]",
    "**/*.sqlite*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vneurotk"]

[tool.hatch.build.targets.wheel.shared-data]
"CITATION.cff" = "share/doc/vneurotk/CITATION.cff"
"README.md" = "share/doc/vneurotk/README.md"

[tool.hatch.build.targets.sdist]
include = [
    "/CITATION.cff",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/vneurotk/**/*.py",
]

[project.urls]
bugs = "https://github.com/colehank/vneurotk/issues"
changelog = "https://github.com/colehank/vneurotk/releases"
documentation = "https://colehank.github.io/vneurotk/"
homepage = "https://github.com/colehank/vneurotk"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# unresolved-import: optional extras (torch, transformers, mne, matplotlib, timm)
# are not installed in the typecheck environment, so downgrade to warn instead of error.

[tool.ty.rules]
unresolved-import = "warn"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "-m",
    "not vision and not viz and not backend_transformers and not backend_timm and not backend_thingsvision and not hdf5_compat and not sample_data and not integration and not network and not slow",
]
markers = [
    "vision: tests for the optional vision feature stack",
    "viz: tests for the optional visualization feature stack",
    "backend_transformers: tests for the transformers model backend",
    "backend_timm: tests for the timm model backend",
    "backend_thingsvision: tests for the thingsvision model backend",
    "hdf5_compat: HDF5 compatibility and round-trip tests",
    "sample_data: tests against the published real sample archives",
    "integration: tests requiring external data or full third-party integrations",
    "network: tests that access network resources",
    "slow: tests with significant runtime or memory requirements",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/vneurotk"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.uv]
package = true
default-groups = []
