[project]
site_name = "VneuroTK"
site_url = "https://colehank.github.io/VneuroTK/"
repo_url = "https://github.com/colehank/vneurotk"
repo_name = "colehank/vneurotk"

features = [
  "navigation.indexes",
  "navigation.top",
  "content.code.copy",
  "content.tooltips",
]

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "File formats" = [
    { "HDF5 recordings" = "format/hdf5.md" },
  ]},
  { "Usage" = [
    { "Overview" = "usage.md" },
    { "Path system" = "usage/path.md"},
    { "Neural data" = "usage/data.md"},
    { "Vision models and backends" = "usage/vision_models.md"},
    { "Vision extraction (standalone)" = "usage/vision_alone.md"},
    { "Vision extraction (with data)" = "usage/vision_union.md"},
  ]},
  { "Examples" = [
    { "NOD-MEG neurovision workflow" = "example/nod-neurovision.md" },
    { "Data notebook" = "example_ipynb/data.ipynb" },
    { "Path notebook" = "example_ipynb/path.ipynb" },
    { "Vision notebook" = "example_ipynb/vision.ipynb" },
    { "Neurovision notebook" = "example_ipynb/neurovision.ipynb" },
  ]},
  { "API Reference" = [
    { "Overview" = "api.md" },
    { "Core" = "api/core.md" },
    { "Logging" = "api/logging.md" },
    { "IO" = "api/io.md" },
    { "Neuro" = "api/neuro.md" },
    { "Vision" = "api/vision.md" },
    { "Datasets" = "api/datasets.md" },
    { "Viz" = "api/viz.md" },
  ]},
  { "Project" = [
    { "Contributing" = "contribute.md" },
    { "Governance" = "governance.md" },
    { "Support" = "support.md" },
    { "Citation" = "citation.md" },
    { "Data policy" = "data-policy.md" },
    { "Code of conduct" = "code_of_conduct.md" },
    { "Security" = "security.md" },
  ]},
  { "Changelog" = "changelog.md" },
]

[project.theme]
logo = "assets/logo.svg"
favicon = "assets/logo.svg"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"