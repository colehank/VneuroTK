name: Published sample data validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: sample-data-validation
  cancel-in-progress: true

jobs:
  downloader-contract:
    name: Downloader contract (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install locked test environment
        run: uv sync --frozen --python=3.13 --group test

      - name: Run offline downloader contract tests
        env:
          VNEUROTK_SAMPLE_CACHE: ${{ runner.temp }}/vneurotk-offline-sample-cache
        run: uv run --frozen --no-sync --python=3.13 python -m pytest tests/test_datasets_sample.py

  nod-smoke:
    name: NOD-MEG fresh sample smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VNEUROTK_TEST_SAMPLE_DATA: "1"
      VNEUROTK_TEST_INTEGRATION: "1"
      VNEUROTK_RUN_NETWORK: "1"
      VNEUROTK_TEST_SLOW: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install locked NOD-MEG test environment
        run: uv sync --frozen --python=3.13 --group test --extra mne

      - name: Download, integrity-check, and smoke-test a fresh NOD-MEG sample
        env:
          VNEUROTK_SAMPLE_CACHE: ${{ runner.temp }}/vneurotk-nod-sample-cache
        run: >-
          uv run --frozen --no-sync --python=3.13 python -m pytest
          -o addopts="--strict-config --strict-markers -ra"
          -m "sample_data and integration and network and slow"
          tests/test_sample_data_integration.py
          -k "nod"

  monkey-smoke:
    name: MonkeyVision fresh sample smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VNEUROTK_TEST_SAMPLE_DATA: "1"
      VNEUROTK_TEST_INTEGRATION: "1"
      VNEUROTK_RUN_NETWORK: "1"
      VNEUROTK_TEST_SLOW: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install locked MonkeyVision test environment
        run: uv sync --frozen --python=3.13 --group test

      - name: Download, integrity-check, and smoke-test a fresh MonkeyVision sample
        env:
          VNEUROTK_SAMPLE_CACHE: ${{ runner.temp }}/vneurotk-monkey-sample-cache
        run: >-
          uv run --frozen --no-sync --python=3.13 python -m pytest
          -o addopts="--strict-config --strict-markers -ra"
          -m "sample_data and integration and network and slow"
          tests/test_sample_data_integration.py
          -k "monkey"

  sample-validation-pass:
    name: Published sample validation passed
    if: always()
    needs: [downloader-contract, nod-smoke, monkey-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check sample validation job results
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
