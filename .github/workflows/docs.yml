name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: docs-deploy
  # Let in-flight deployments finish to avoid a half-deployed site.
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Test documentation source contract
        run: uv run --frozen --python=3.13 --group docs --group test pytest tests/test_docs.py

      - name: Execute deterministic visualization notebooks
        env:
          MPLBACKEND: Agg
        run: uv run --frozen --python=3.13 --group docs --extra viz --extra notebook python scripts/docs.py check-viz

      - name: Check external documentation links
        run: uv run --frozen --python=3.13 --group docs sphinx-build -b linkcheck -W --keep-going docs build/linkcheck

      - name: Build docs
        run: uv run --frozen --python=3.13 --group docs python scripts/docs.py build

      - name: Test built documentation contract
        run: VNEUROTK_DOCS_SITE=site uv run --frozen --python=3.13 --group docs --group test pytest tests/test_docs.py

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
