name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed release tag to publish"
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate exact release distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release payload, checkout, and origin/main ancestry
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          event_args=()
          if [[ "$EVENT_NAME" == "release" ]]; then
            event_args=(--event-path "$EVENT_PATH")
          fi
          python scripts/release.py validate-publish "$RELEASE_TAG" \
            --event-name "$EVENT_NAME" "${event_args[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify release notes exist
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: test -s "CHANGELOG/$RELEASE_VERSION.md"

      # Cache disabled so release artifacts never depend on a mutable cache.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Build and validate distributions
        run: uvx --from rust-just just build-check

      - name: Validate filenames, metadata, and installed wheel
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import email.parser
          import os
          import pathlib
          import tarfile
          import zipfile

          expected = os.environ["RELEASE_VERSION"]
          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist, found {wheels!r}, {sdists!r}")
          wheel, sdist = wheels[0], sdists[0]
          if not wheel.name.startswith(f"vneurotk-{expected}-"):
              raise SystemExit(f"wheel filename/version mismatch: {wheel.name!r} vs {expected!r}")
          if sdist.name != f"vneurotk-{expected}.tar.gz":
              raise SystemExit(f"sdist filename/version mismatch: {sdist.name!r} vs {expected!r}")
          with zipfile.ZipFile(wheel) as archive:
              metadata_names = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_names) != 1:
                  raise SystemExit(f"expected one wheel METADATA file, found {metadata_names!r}")
              metadata = email.parser.BytesParser().parsebytes(archive.read(metadata_names[0]))
          if metadata["Name"].lower() != "vneurotk" or metadata["Version"] != expected:
              raise SystemExit(f"wheel metadata mismatch: {metadata['Name']!r} {metadata['Version']!r}")
          with tarfile.open(sdist) as archive:
              pkg_info = [member for member in archive.getmembers() if member.name.endswith("/PKG-INFO")]
              if len(pkg_info) != 1:
                  raise SystemExit(f"expected one sdist PKG-INFO file, found {[m.name for m in pkg_info]!r}")
              extracted = archive.extractfile(pkg_info[0])
              assert extracted is not None
              metadata = email.parser.BytesParser().parse(extracted)
          if metadata["Name"].lower() != "vneurotk" or metadata["Version"] != expected:
              raise SystemExit(f"sdist metadata mismatch: {metadata['Name']!r} {metadata['Version']!r}")
          print(f"artifact metadata OK: {expected}")
          PY
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          uv venv --python=3.13 "$smoke_root/venv"
          uv pip install --python "$smoke_root/venv/bin/python" dist/*.whl
          (
            cd "$smoke_root"
            "$smoke_root/venv/bin/python" - "$RELEASE_VERSION" <<'PY'
          import importlib.metadata
          import sys

          expected = sys.argv[1]
          actual = importlib.metadata.version("vneurotk")
          if actual != expected:
              raise SystemExit(f"installed metadata mismatch: {actual!r} vs {expected!r}")
          import vneurotk
          print(f"installed import OK: vneurotk {actual}")
          PY
          )

      - name: Upload immutable workflow distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ steps.release.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish exact validated artifact to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    # Protect this environment with required reviewers. The workflow trigger alone
    # cannot enforce manual approval; repository environment rules do that.
    environment:
      name: pypi
      url: https://pypi.org/p/vneurotk/${{ needs.build.outputs.version }}
    steps:
      - name: Download distribution from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.build.outputs.tag }}
          path: dist/

      - name: Verify downloaded artifact set
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib

          expected = os.environ["RELEASE_VERSION"]
          files = sorted(pathlib.Path("dist").iterdir())
          wheels = [path for path in files if path.suffix == ".whl"]
          sdists = [path for path in files if path.name.endswith(".tar.gz")]
          if len(files) != 2 or len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"unexpected downloaded artifact set: {[path.name for path in files]!r}")
          if sdists[0].name != f"vneurotk-{expected}.tar.gz":
              raise SystemExit("downloaded sdist does not match approved version")
          print(f"ready to publish exact validated artifacts for {expected}")
          PY

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
