name: Bug Report
description: Report a reproducible VneuroTK problem.
title: "BUG: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues first. Do not attach restricted participant data,
        licensed stimuli, credentials, or other private material.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest complete example, exact command, traceback, and expected behavior. Redact secrets and private data.
      placeholder: |
        ```python
        import vneurotk
        # minimal example using synthetic or redistributable data
        ```
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VneuroTK version or Git revision
      description: Include `vneurotk.__version__`, package source, or full commit.
      placeholder: "0.0.1 or full Git commit"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.13.5"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: extra-backend
    attributes:
      label: Installed extra and backend
      description: Name the extra (`core`, `vision`, `viz`, `mne`, `timm`, `thingsvision`, or `cebra`), backend/model identifier, and relevant dependency versions. Use `not applicable` when appropriate.
      placeholder: "vision; transformers; facebook/dinov2-base; torch 2.x"
    validations:
      required: true
  - type: textarea
    id: data-provenance
    attributes:
      label: Data source, license, and privacy
      description: Identify the source/accession and license or say `synthetic`, `not applicable`, or `unknown`. Confirm the reproduction contains no restricted data.
      placeholder: "Synthetic array; no participant or licensed stimulus data included."
    validations:
      required: true
  - type: dropdown
    id: network-integration
    attributes:
      label: Network or external integration required?
      description: Select the best description for the reproduction.
      options:
        - No; reproduces offline
        - Yes; network download required
        - Yes; local third-party integration or artifact required
        - Unknown
    validations:
      required: true
  - type: textarea
    id: integration-details
    attributes:
      label: Network/integration details
      description: If applicable, name the service, artifact/model identifier, cache state, authentication method without secrets, hardware/driver, and whether an offline reproduction was attempted.
    validations:
      required: false
  - type: textarea
    id: acceptance-evidence
    attributes:
      label: Acceptance evidence
      description: State the observable result that would demonstrate a fix and any regression test you can suggest.
      placeholder: "The example completes offline and returns shape (...); a test fails before and passes after the fix."
    validations:
      required: true
